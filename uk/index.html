<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LÉVIA by Salomé — Understand your skin. Finally.</title>
  <meta name="description" content="A personalised skincare experience powered by LÉVIA AI. Get your free personalised skincare routine." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'YOUR_PIXEL_ID');
    fbq('track', 'PageView');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fdefe2;
    }

    .landing-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .landing-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* BOUTON CLIQUABLE — transparent, positionné par JS pile sur le bouton du visuel */
    .cta-button {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      border: none;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      text-decoration: none;
      z-index: 10;

      /* Texte visible avec style doré */
      font-family: 'Playfair Display', 'Georgia', serif;
      font-weight: 500;
      color: #e8c36a;
      text-shadow: 0 0 10px rgba(232,195,106,0.6), 0 0 20px rgba(201,147,58,0.3), 0 1px 2px rgba(0,0,0,0.5);
      white-space: nowrap;
      
      /* Fond doré glassmorphism */
      background:
        linear-gradient(145deg,
          rgba(40,30,20,0.95) 0%,
          rgba(20,15,10,0.98) 50%,
          rgba(10,8,5,1) 100%);

      box-shadow:
        0 20px 40px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -10px 20px rgba(0,0,0,0.3);

      overflow: hidden;
      transition: transform 0.45s ease, box-shadow 0.45s ease;
    }

    .cta-button.visible {
      opacity: 1;
      animation: pulse 1.2s ease-in-out infinite;
    }

    /* Effet shine qui balaye */
    .cta-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(201,147,58,0) 0%,
        rgba(255,220,130,0.5) 40%,
        rgba(201,147,58,0) 80%
      );
      transform: translateX(-120%);
      animation: shine 4s infinite;
      pointer-events: none;
    }

    /* Clignotement glow doré */
    @keyframes goldShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes pulse {
      0%, 100% {
        transform: translateX(-50%) scale(1);
      }
      50% {
        transform: translateX(-50%) scale(1.05);
      }
    }

    @keyframes shine {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(140%); }
    }

    .cta-button:hover {
      transform: translateX(-50%) scale(1.03);
      box-shadow:
        0 28px 55px rgba(0,0,0,0.6),
        0 0 50px rgba(255,220,130,0.5);
    }

    .cta-button:active {
      transform: translateX(-50%) scale(0.97);
    }

    .cta-button .text { position: relative; z-index: 2; }
    .cta-button .sparkle {
      position: relative;
      z-index: 2;
      color: #e8c36a;
      text-shadow: 0 0 10px rgba(232,195,106,0.6), 0 0 20px rgba(201,147,58,0.3), 0 1px 2px rgba(0,0,0,0.5);
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <img class="landing-bg" id="bg" src="landing.png" alt="LÉVIA by Salomé — Understand your skin. Finally." />

    <a href="/scan" class="cta-button" id="cta" onclick="trackClick('start_routine')">
      <span class="text">Start my free routine</span>
      <span class="sparkle">✦</span>
    </a>
  </div>

  <script>
    function positionButton() {
      var btn = document.getElementById('cta');
      var wrapW = window.innerWidth;
      var wrapH = window.innerHeight;

      // Ratio de l'image originale
      var imgRatio = 941 / 1672;
      var wrapRatio = wrapW / wrapH;
      var imgW, imgH;

      if (wrapRatio > imgRatio) {
        imgH = wrapH;
        imgW = wrapH * imgRatio;
      } else {
        imgW = wrapW;
        imgH = wrapW / imgRatio;
      }

      // Le bouton "Start my free routine" est à 87% de la hauteur de l'image
      var btnTop = imgH * 0.874;
      // Largeur du bouton = 56% de la largeur de l'image
      var btnWidth = imgW * 0.564;
      // Hauteur du bouton = 4.5% de la hauteur de l'image
      var btnHeight = imgH * 0.047;
      // Police proportionnelle
      var fontSize = Math.max(14, imgW * 0.038);

      btn.style.top = btnTop + 'px';
      btn.style.width = Math.max(200, btnWidth) + 'px';
      btn.style.height = btnHeight + 'px';
      btn.style.fontSize = fontSize + 'px';
      btn.classList.add('visible');
    }

    document.getElementById('bg').onload = positionButton;
    window.addEventListener('resize', positionButton);
    window.addEventListener('orientationchange', function() {
      setTimeout(positionButton, 100);
    });
    // Fallback si l'image est déjà en cache
    if (document.getElementById('bg').complete) positionButton();

    function trackClick(buttonName) {
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead', { content_name: buttonName });
      }
    }
  </script>

</body>
</html>
