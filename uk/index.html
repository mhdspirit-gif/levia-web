<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LÉVIA by Salomé — Understand your skin. Finally.</title>
  <meta name="description" content="A personalised skincare experience powered by LÉVIA AI. Discover your skin score and your first personalised routine, free." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'YOUR_PIXEL_ID');
    fbq('track', 'PageView');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background: #f6e3d2;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    .landing-wrapper {
      position: relative;
      width: 100%;
      max-width: 853px;
      margin: 0 auto;
      line-height: 0;
    }

    .landing-bg {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* BOUTON OR GLASSMORPHISM */
    .cta-button {
      position: absolute;
      left: 50%;
      top: 79.6%;
      transform: translateX(-50%);
      width: 57.1%;
      max-width: 540px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      border: none;
      border-radius: 999px;
      padding: 6.3% 7.2%;

      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(16px, 2.4vw, 30px);
      font-weight: 500;
      color: #1d140d;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;

      background:
        linear-gradient(145deg,
          rgba(255,240,212,0.95) 0%,
          rgba(255,196,102,0.98) 35%,
          rgba(194,121,28,1) 100%);

      box-shadow:
        0 20px 40px rgba(188,122,38,0.42),
        inset 0 1px 0 rgba(255,255,255,0.9),
        inset 0 -10px 20px rgba(133,74,9,0.18);

      overflow: hidden;
      transition: all 0.45s ease;
      z-index: 10;
    }

    .cta-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.6) 40%,
        rgba(255,255,255,0) 80%
      );
      transform: translateX(-120%);
      animation: shine 4s infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(140%); }
    }

    .cta-button:hover {
      transform: translateX(-50%) scale(1.02);
      box-shadow:
        0 28px 55px rgba(188,122,38,0.55),
        0 0 50px rgba(255,206,122,0.55);
    }

    .cta-button:active {
      transform: translateX(-50%) scale(0.98);
    }

    .cta-button .text { position: relative; z-index: 2; }
    .cta-button .sparkle {
      position: relative;
      z-index: 2;
      color: #1d140d;
      font-size: 0.85em;
    }

    @media (max-width: 600px) {
      .cta-button {
        font-size: clamp(13px, 3.5vw, 18px);
        padding: 2.2% 3%;
      }
    }
  </style>
</head>
<body>

  <div class="landing-wrapper">
    <img class="landing-bg" src="landing.png" alt="LÉVIA by Salomé — Understand your skin. Finally." />

    <a href="/scan" class="cta-button" onclick="trackClick('start_routine')">
      <span class="text">Start my free routine</span>
      <span class="sparkle">✦</span>
    </a>
  </div>

  <script>
    function trackClick(buttonName) {
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead', { content_name: buttonName });
      }
    }
  </script>

</body>
</html>
